<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06111a">
<title>THADEN Dokumentation – VNF auswählen</title>
<style>
:root{
  --bg:#06111a; --panel:#102331; --edge:#3a708b; --white:#f5f7fa;
  --muted:#c0ccd6; --orange:#ff6b0a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:#06111a;color:var(--white);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{overflow:hidden}
.app{min-height:100svh;padding:25px 26px 28px;position:relative}
.status{height:42px;display:flex;align-items:center;justify-content:space-between;
font-size:17px;font-weight:700;padding:0 9px}
.status-right{display:flex;align-items:center;gap:9px}
.signal{letter-spacing:-2px;font-size:15px}.battery{border:2px solid #fff;border-radius:5px;
padding:0 4px;line-height:18px;font-size:13px;position:relative}
.header{height:137px;margin-top:13px;border:1.5px solid #173d54;border-radius:25px;
display:flex;align-items:center;justify-content:center;background:rgba(8,18,28,.5);
box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 16px 35px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;width:86%;max-width:590px;height:90px}
.mark{width:205px;height:76px;position:relative;flex:none}
.mark .t1{position:absolute;left:0;top:0;width:110px;height:25px;background:#fff;transform:skewX(-25deg)}
.mark .t2{position:absolute;left:15px;top:29px;width:108px;height:25px;background:#fff;transform:skewX(-25deg)}
.mark .d{position:absolute;right:0;top:0;width:105px;height:55px;border-radius:0 36px 36px 0;background:var(--orange)}
.mark .cut{position:absolute;right:9px;top:14px;width:69px;height:27px;border-radius:0 18px 18px 0;background:#06111a}
.sep{height:72px;width:2px;background:#fff;margin:0 17px 0 9px}
.words{line-height:.9}.thaden{font-size:34px;font-weight:850;letter-spacing:-1.7px}
.doku{font-size:21px;font-weight:850;color:var(--orange);letter-spacing:-.7px;margin-top:4px}
.tag{font-size:8px;letter-spacing:2px;font-weight:700;margin-top:7px;white-space:nowrap}
.content{text-align:center;margin-top:56px}
.kicker{font-size:16px;letter-spacing:7px;color:#b9c5cf;margin-bottom:18px}
h1{font-size:42px;line-height:1;margin:0;font-weight:850;letter-spacing:-1.4px}
.sub{font-size:19px;color:#c2ced8;margin:29px 0 0;line-height:1.25}
.buttons{width:min(100%,495px);margin:72px auto 0;display:grid;gap:29px}
.btn{height:108px;border-radius:24px;border:1.5px solid var(--edge);
background:linear-gradient(180deg,#122737 0%,#0e202e 100%);display:flex;align-items:center;
padding:0 35px 0 40px;color:#f7f9fb;text-align:left;box-shadow:0 11px 22px rgba(0,0,0,.34),
inset 0 1px 0 rgba(255,255,255,.06);cursor:pointer;position:relative;overflow:hidden;
transition:transform .12s ease,box-shadow .15s ease,border-color .15s ease}
.btn:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 25%,
rgba(255,255,255,.08) 48%,transparent 70%);transform:translateX(-110%);transition:.45s}
.btn:active,.btn.selected{transform:translateY(3px) scale(.988);border-color:var(--orange);
box-shadow:0 0 22px rgba(255,107,10,.34),0 5px 12px rgba(0,0,0,.45),inset 0 2px 5px rgba(0,0,0,.25)}
.btn:active:after,.btn.selected:after{transform:translateX(110%)}
.label{font-size:23px;font-weight:760;letter-spacing:-.4px}
.arrow{margin-left:auto;color:var(--orange);font-size:43px;font-weight:300;line-height:1}
.btn.selected .arrow{transform:translateX(3px) scale(1.08)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,15px);opacity:0;
background:#102331;border:1px solid rgba(255,107,10,.7);border-radius:13px;padding:10px 16px;
font-size:14px;font-weight:700;box-shadow:0 8px 25px rgba(0,0,0,.4);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){
 .app{padding:20px 26px 26px}.status{height:35px}
 .header{height:137px;margin-top:12px}.brand{width:91%}.mark{width:175px;transform:scale(.88);transform-origin:left center}
 .sep{margin-left:0;margin-right:12px}.thaden{font-size:30px}.doku{font-size:18px}.tag{font-size:6.5px;letter-spacing:1.5px}
 .content{margin-top:57px}.kicker{font-size:14px;letter-spacing:6px}h1{font-size:41px}.sub{font-size:18px;margin-top:28px}
 .buttons{margin-top:72px;gap:29px}.btn{height:106px;padding-left:40px;padding-right:34px}.label{font-size:22px}
}
</style>
</head>
<body>
<div class="app">
  <div class="status"><span>22:21</span><div class="status-right"><span class="signal">▮▮▮</span><span>4G</span><span class="battery">81</span></div></div>
  <div class="header">
    <div class="brand">
      <div class="mark"><i class="t1"></i><i class="t2"></i><i class="d"></i><i class="cut"></i></div>
      <div class="sep"></div>
      <div class="words"><div class="thaden">THADEN<sup style="font-size:10px">®</sup></div><div class="doku">DOKUMENTATION</div><div class="tag">EINFACH. DIGITAL. DOKUMENTIERT.</div></div>
    </div>
  </div>
  <section class="content">
    <div class="kicker">DOKUMENTATION</div>
    <h1>VNF auswählen</h1>
    <p class="sub">Bitte den gewünschten Auftraggeber auswählen.</p>
    <div class="buttons">
      <button class="btn" data-name="VNF Glasfaser NordWest"><span class="label">VNF Glasfaser NordWest</span><span class="arrow">›</span></button>
      <button class="btn" data-name="VNF Telekom"><span class="label">VNF Telekom</span><span class="arrow">›</span></button>
      <button class="btn" data-name="Auswertung"><span class="label">Auswertung</span><span class="arrow">›</span></button>
    </div>
  </section>
</div>
<div id="toast" class="toast"></div>
<script>
const toast=document.getElementById('toast');
document.querySelectorAll('.btn').forEach(btn=>{
 btn.addEventListener('click',()=>{
   document.querySelectorAll('.btn').forEach(x=>x.classList.remove('selected'));
   btn.classList.add('selected');
   const name=btn.dataset.name;
   localStorage.setItem('thaden_vnf_selection',name);
   toast.textContent=name+' ausgewählt';
   toast.classList.add('show');
   clearTimeout(window.t); window.t=setTimeout(()=>toast.classList.remove('show'),1100);
 });
});
</script>
</body>
</html>
