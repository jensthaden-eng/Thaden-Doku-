<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111a">
<title>THADEN DOKUMENTATION – Seite 2</title>
<style>
:root{
  --bg:#07111a; --bg2:#0b1621; --text:#f5f7fa; --muted:#b8c4cf;
  --orange:#ff6b12; --edge:#315a72;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,var(--bg),#061019 55%,#050d14);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
body{min-height:100svh;overflow:hidden}
.screen{min-height:100svh;padding:18px 22px 28px;display:flex;flex-direction:column}
.status{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 7px;font-weight:700;font-size:18px}
.status .right{display:flex;gap:10px;align-items:center;font-size:17px}
.logoBox{margin-top:11px;border:1px solid #173b51;border-radius:28px;padding:9px 11px;background:rgba(8,17,26,.72);box-shadow:0 10px 28px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.035)}
.logoBox img{width:100%;display:block;height:auto;border-radius:20px}
.content{text-align:center;margin-top:70px}
.kicker{font-size:16px;letter-spacing:7px;color:#aebbc7;margin-bottom:22px}
h1{font-size:44px;line-height:1.02;margin:0;font-weight:800;letter-spacing:-1.2px}
.sub{font-size:20px;color:#bdc9d4;margin:28px 0 0;line-height:1.25}
.choices{width:min(100%,590px);margin:72px auto 0;display:grid;gap:28px}
.choice{
  position:relative;width:100%;height:108px;border-radius:25px;
  border:1px solid #38667e;
  background:linear-gradient(180deg,#122534,#0b1721);
  color:#f7f9fb;display:flex;align-items:center;text-align:left;
  padding:0 28px 0 30px;box-shadow:0 13px 28px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.08);
  cursor:pointer;transition:transform .12s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease;
  overflow:hidden;user-select:none;
}
.choice:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.07) 48%,transparent 61%);transform:translateX(-120%);transition:transform .45s ease}
.choice:active{transform:translateY(4px) scale(.985);box-shadow:0 5px 14px rgba(0,0,0,.45),inset 0 2px 5px rgba(0,0,0,.28);border-color:var(--orange)}
.choice.pressed{border-color:var(--orange);box-shadow:0 0 0 1px rgba(255,107,18,.32),0 0 28px rgba(255,107,18,.32),0 12px 28px rgba(0,0,0,.35)}
.choice.pressed:before{transform:translateX(120%)}
.label{font-size:25px;font-weight:750;letter-spacing:-.3px}
.arrow{margin-left:auto;font-size:44px;line-height:1;color:var(--orange);font-weight:400;transition:transform .16s ease}
.choice.pressed .arrow{transform:translateX(3px) scale(1.06)}
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,18px);opacity:0;padding:12px 18px;border-radius:15px;background:rgba(15,27,38,.96);border:1px solid rgba(255,107,18,.6);box-shadow:0 8px 28px rgba(0,0,0,.4),0 0 20px rgba(255,107,18,.14);font-weight:700;transition:.22s ease;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){
 .screen{padding-left:22px;padding-right:22px}
 .content{margin-top:62px}.kicker{font-size:14px;letter-spacing:5px}
 h1{font-size:42px}.sub{font-size:18px}
 .choices{margin-top:64px;gap:22px}
 .choice{height:96px;padding-left:25px;padding-right:24px;border-radius:23px}
 .label{font-size:21px}.arrow{font-size:39px}
}
</style>
</head>
<body>
<main class="screen">
  <div class="status"><span>22:21</span><div class="right"><span>▮▮▮</span><span>4G</span><span>81</span></div></div>

  <div class="logoBox"><img src="assets/thaden-header-logo.png" alt="THADEN Dokumentation"></div>

  <section class="content">
    <div class="kicker">DOKUMENTATION</div>
    <h1>VNF auswählen</h1>
    <p class="sub">Bitte den gewünschten Auftraggeber auswählen.</p>

    <div class="choices">
      <button class="choice" data-name="VNF Glasfaser NordWest">
        <span class="label">VNF Glasfaser NordWest</span><span class="arrow">›</span>
      </button>
      <button class="choice" data-name="VNF Telekom">
        <span class="label">VNF Telekom</span><span class="arrow">›</span>
      </button>
      <button class="choice" data-name="Auswertung">
        <span class="label">Auswertung</span><span class="arrow">›</span>
      </button>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const toast=document.getElementById('toast');
document.querySelectorAll('.choice').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.choice').forEach(b=>b.classList.remove('pressed'));
    btn.classList.add('pressed');
    const name=btn.dataset.name;
    toast.textContent = name + ' ausgewählt';
    toast.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer=setTimeout(()=>toast.classList.remove('show'),1100);
    // Selection is saved for the next page/workflow.
    localStorage.setItem('thaden_vnf_selection', name);
  });
});
</script>
</body>
</html>
