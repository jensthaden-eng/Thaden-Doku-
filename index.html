<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071019">
<title>THADEN DOKUMENTATION – Test</title>
<style>
:root{--bg:#071019;--panel:#0e1922;--panel2:#111f2a;--line:#203b4c;--orange:#ff6b00;--white:#f7f9fb;--muted:#9fb1bf;--green:#16b66b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{display:flex;justify-content:center}
.app{width:min(100%,520px);min-height:100vh;padding:24px 20px 34px}
.header{height:105px;border:1px solid #132532;background:#0d171f;border-radius:22px;display:flex;align-items:center;justify-content:center;padding:14px;margin-bottom:28px}
.header strong{font-size:24px;letter-spacing:.5px}
.header span{color:var(--orange)}
.screen{display:none;animation:in .35s ease}
.screen.active{display:block}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.kicker{color:var(--muted);font-size:15px;text-transform:uppercase;letter-spacing:2px;text-align:center}
h1{font-size:34px;line-height:1.08;text-align:center;margin:8px 0 10px}
.sub{text-align:center;color:var(--muted);font-size:17px;margin:0 auto 26px}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:24px 0 28px}
.dot{width:15px;height:15px;border-radius:50%;background:#25323b;border:1px solid #40505b;transition:.15s}
.dot.on{background:var(--orange);border-color:var(--orange);box-shadow:0 0 16px #ff6b0066;transform:scale(1.12)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:360px;margin:auto}
.key{height:66px;border:1px solid #294353;border-radius:18px;background:linear-gradient(180deg,#14232e,#0d1922);color:white;font-size:24px;font-weight:750;position:relative;overflow:hidden;transition:transform .09s,box-shadow .15s,border-color .15s}
.key:active,.key.pressed{transform:scale(.94);border-color:var(--orange);box-shadow:0 0 0 3px #ff6b001f,0 8px 24px #ff6b0030}
.key::after{content:"";position:absolute;inset:50%;width:10px;height:10px;border-radius:50%;background:white;opacity:0;transform:translate(-50%,-50%) scale(1);pointer-events:none}
.key.pressed::after{animation:ripple .35s ease-out}
@keyframes ripple{0%{opacity:.7;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(18)}}
.error{animation:shake .32s ease;border-color:#ff3b30!important}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.unlock{position:fixed;inset:0;background:white;opacity:0;pointer-events:none;z-index:20}
.unlock.show{animation:flash .55s ease}
@keyframes flash{0%{opacity:0}20%{opacity:.95}100%{opacity:0}}
.vnf-card{background:#fff;border-radius:28px;padding:16px;margin:18px 0;border:2px solid transparent;box-shadow:0 14px 36px #0005;transition:.18s;overflow:hidden}
.vnf-card:active{transform:scale(.985);border-color:var(--orange)}
.vnf-card img{display:block;width:100%;height:155px;object-fit:contain;background:#e9e9e9;border-radius:18px}
.vnf-name{display:flex;align-items:center;justify-content:space-between;color:#111;margin-top:12px;font-size:21px;font-weight:800}
.vnf-name b{color:var(--orange);font-size:25px}
.choice{text-align:center;color:var(--muted);font-size:15px;margin-top:26px}
.badge{display:inline-block;margin-top:16px;padding:9px 13px;border:1px solid #294353;border-radius:999px;color:#cfe0eb}
</style>
</head>
<body>
<div class="app">
  <div class="header"><strong>THADEN <span>DOKUMENTATION</span></strong></div>

  <section id="pin" class="screen active">
    <div class="kicker">Sicherer Start</div>
    <h1>Willkommen</h1>
    <p class="sub">Bitte PIN eingeben</p>
    <div id="dots" class="pin-dots">
      <i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i>
    </div>
    <div id="keypad" class="keypad">
      <button class="key" data-n="1">1</button><button class="key" data-n="2">2</button><button class="key" data-n="3">3</button>
      <button class="key" data-n="4">4</button><button class="key" data-n="5">5</button><button class="key" data-n="6">6</button>
      <button class="key" data-n="7">7</button><button class="key" data-n="8">8</button><button class="key" data-n="9">9</button>
      <span></span><button class="key" data-n="0">0</button><button class="key" id="back">⌫</button>
    </div>
    <div class="choice">Test-PIN: <b>1234</b><div class="badge">Tastendruck mit Pulseffekt</div></div>
  </section>

  <section id="vnf" class="screen">
    <div class="kicker">Auftraggeber auswählen</div>
    <h1>VNF auswählen</h1>
    <p class="sub">Bitte den gewünschten Auftraggeber auswählen.</p>

<script>
const correct="1234"; let pin="";
const dots=[...document.querySelectorAll(".dot")], keys=[...document.querySelectorAll(".key[data-n]")];
function updateDots(){dots.forEach((d,i)=>d.classList.toggle("on",i<pin.length));}
function press(btn,n){
  btn.classList.remove("pressed"); void btn.offsetWidth; btn.classList.add("pressed");
  if(navigator.vibrate) navigator.vibrate(12);
  setTimeout(()=>btn.classList.remove("pressed"),180);
  if(pin.length>=4)return;
  pin+=n; updateDots();
  if(pin.length===4)setTimeout(check,140);
}
function check(){
  if(pin===correct){
    document.getElementById("unlock").classList.add("show");
    setTimeout(()=>{document.getElementById("pin").classList.remove("active");document.getElementById("vnf").classList.add("active");},220);
  } else {
    document.getElementById("keypad").classList.add("error");
    if(navigator.vibrate) navigator.vibrate([35,45,35]);
    setTimeout(()=>document.getElementById("keypad").classList.remove("error"),380);
    pin=""; updateDots();
  }
}
keys.forEach(k=>k.addEventListener("click",()=>press(k,k.dataset.n)));
document.getElementById("back").addEventListener("click",()=>{pin=pin.slice(0,-1);updateDots();});
document.getElementById("nw").addEventListener("click",()=>alert("VNF Glasfaser NordWest ausgewählt – hier öffnet anschließend die Arbeitsübersicht."));
document.getElementById("telekom").addEventListener("click",()=>alert("VNF Telekom ausgewählt – hier öffnet anschließend die Arbeitsübersicht."));
</script>
</body>
</html>
