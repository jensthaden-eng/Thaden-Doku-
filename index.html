<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06111a">
<title>THADEN DOKUMENTATION</title>
<style>
:root{
 --bg:#06111a;--panel:#102432;--edge:#2e6682;--white:#f5f7fa;
 --muted:#becbd5;--orange:#ff6b0a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{overflow:hidden}
.page{display:none;min-height:100svh;padding:calc(env(safe-area-inset-top) + 12px) 26px 24px}
.page.active{display:flex;flex-direction:column}
.header{
 height:137px;margin-top:8px;border:1.5px solid #173d54;border-radius:25px;
 background:rgba(8,18,28,.52);display:flex;align-items:center;justify-content:center;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 15px 35px rgba(0,0,0,.18);overflow:hidden
}
.header img{width:90%;max-width:610px;height:105px;object-fit:contain}
.section{text-align:center;margin-top:56px}
.kicker{font-size:15px;letter-spacing:6px;color:#b9c5cf;margin-bottom:18px}
h1{font-size:42px;line-height:1;margin:0;font-weight:850;letter-spacing:-1.4px}
.sub{font-size:19px;color:var(--muted);margin:29px 0 0;line-height:1.3}
.pin-dots{display:flex;justify-content:center;gap:17px;margin:54px 0 34px}
.dot{width:15px;height:15px;border-radius:50%;border:2px solid #718594;background:transparent}
.dot.on{background:var(--orange);border-color:var(--orange);box-shadow:0 0 14px rgba(255,107,10,.5)}
.keypad{width:235px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.key{height:54px;border:1px solid #29495d;border-radius:16px;background:linear-gradient(180deg,#142a39,#0c1d29);
color:#fff;font-size:22px;font-weight:700;box-shadow:0 7px 12px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.06);
transition:.09s;cursor:pointer}
.key:active,.key.flash{transform:translateY(3px) scale(.96);background:var(--orange);border-color:var(--orange);
box-shadow:0 3px 8px rgba(0,0,0,.4),0 0 18px rgba(255,107,10,.28)}
.forgot{margin:25px auto 0;background:none;border:0;color:#9eacb8;font-size:14px;cursor:pointer}
.pin-error{animation:shake .28s}.pin-error .dot{border-color:#ff3b30;box-shadow:0 0 14px rgba(255,59,48,.55)}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-5px)}}
#page2 .section{margin-top:56px}
.buttons{width:min(100%,495px);margin:72px auto 0;display:grid;gap:29px}
.choice{height:108px;border-radius:24px;border:1.5px solid var(--edge);background:linear-gradient(180deg,#122737,#0e202e);
color:#f7f9fb;display:flex;align-items:center;text-align:left;padding:0 35px 0 40px;
box-shadow:0 11px 22px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.06);
cursor:pointer;transition:.12s;position:relative;overflow:hidden}
.choice:before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 25%,rgba(255,255,255,.08) 48%,transparent 70%);
transform:translateX(-110%);transition:.45s}
.choice:active,.choice.selected{transform:translateY(3px) scale(.988);border-color:var(--orange);
box-shadow:0 0 22px rgba(255,107,10,.34),0 5px 12px rgba(0,0,0,.45),inset 0 2px 5px rgba(0,0,0,.25)}
.choice:active:before,.choice.selected:before{transform:translateX(110%)}
.label{font-size:23px;font-weight:760;letter-spacing:-.4px}
.arrow{margin-left:auto;color:var(--orange);font-size:43px;font-weight:300;line-height:1}
.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,15px);opacity:0;background:#102331;
border:1px solid rgba(255,107,10,.7);border-radius:13px;padding:10px 16px;font-size:14px;font-weight:700;
box-shadow:0 8px 25px rgba(0,0,0,.4);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){
 .page{padding-left:26px;padding-right:26px}
 .header{height:137px}.header img{width:92%;height:108px}
 .section{margin-top:56px}.kicker{font-size:14px;letter-spacing:6px}h1{font-size:41px}
 .sub{font-size:18px;margin-top:28px}.buttons{margin-top:72px;gap:29px}
 .choice{height:106px;padding-left:40px;padding-right:34px}.label{font-size:22px}
}

/* Seite 2 – kompakter, damit alles sichtbar bleibt */
#page2 .header{height:112px;margin-top:8px}
#page2 .header img{height:84px;width:88%}
#page2 .section{margin-top:38px}
#page2 .kicker{font-size:13px;letter-spacing:5px;margin-bottom:14px}
#page2 h1{font-size:36px}
#page2 .sub{font-size:16px;margin-top:22px}
#page2 .buttons{width:min(100%,455px);margin-top:48px;gap:20px}
#page2 .choice{height:86px;border-radius:21px;padding-left:32px;padding-right:28px}
#page2 .label{font-size:19px}
#page2 .arrow{font-size:37px}
@media(max-width:600px){
  #page2 .header{height:112px}
  #page2 .header img{height:84px;width:90%}
  #page2 .section{margin-top:38px}
  #page2 .kicker{font-size:13px;letter-spacing:5px}
  #page2 h1{font-size:36px}
  #page2 .sub{font-size:16px;margin-top:22px}
  #page2 .buttons{margin-top:48px;gap:20px}
  #page2 .choice{height:86px;padding-left:32px;padding-right:28px}
  #page2 .label{font-size:19px}
}


#page3 .section{margin-top:38px}
#page3 .kicker{font-size:13px;letter-spacing:5px;margin-bottom:14px}
#page3 h1{font-size:36px}
#page3 .sub{font-size:16px;margin-top:22px}
#page3 .area-buttons{width:min(100%,455px);margin:46px auto 0;display:grid;gap:15px}
#page3 .area{
 height:68px;border-radius:20px;border:1.5px solid var(--edge);
 background:linear-gradient(180deg,#122737,#0e202e);color:#f7f9fb;
 display:flex;align-items:center;text-align:left;padding:0 25px 0 30px;
 box-shadow:0 9px 18px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.06);
 cursor:pointer;transition:.12s;position:relative;overflow:hidden
}
#page3 .area:before{content:"";position:absolute;inset:0;
 background:linear-gradient(105deg,transparent 25%,rgba(255,255,255,.08) 48%,transparent 70%);
 transform:translateX(-110%);transition:.45s}
#page3 .area:active,#page3 .area.selected{
 transform:translateY(3px) scale(.988);border-color:var(--orange);
 box-shadow:0 0 22px rgba(255,107,10,.34),0 5px 12px rgba(0,0,0,.45),inset 0 2px 5px rgba(0,0,0,.25)
}
#page3 .area:active:before,#page3 .area.selected:before{transform:translateX(110%)}
#page3 .area-label{font-size:19px;font-weight:760}
#page3 .area-arrow{margin-left:auto;color:var(--orange);font-size:36px;font-weight:300}
#page3 .back{
 height:64px;border-radius:20px;border:1.5px solid var(--edge);
 background:linear-gradient(180deg,#122737,#0e202e);color:#f7f9fb;
 display:flex;align-items:center;justify-content:center;gap:15px;
 box-shadow:0 9px 18px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.06);
 cursor:pointer;transition:.12s;font-size:18px;font-weight:750
}
#page3 .back:active{transform:translateY(3px) scale(.988);border-color:var(--orange);
 box-shadow:0 0 20px rgba(255,107,10,.3),inset 0 2px 5px rgba(0,0,0,.25)}
#page3 .back-arrow{color:var(--orange);font-size:32px;line-height:1}
@media(max-width:600px){
 #page3 .section{margin-top:38px}
 #page3 h1{font-size:36px}
 #page3 .sub{font-size:16px}
 #page3 .area-buttons{margin-top:46px;gap:15px}
 #page3 .area{height:66px;padding-left:30px;padding-right:25px}
 #page3 .area-label{font-size:18px}
 #page3 .area-arrow{font-size:35px}
 #page3 .back{height:62px;font-size:18px}
}

</style>
</head>

<script>
const PIN="1234";let entered="";
const dots=[...document.querySelectorAll("#dots .dot")],toast=document.getElementById("toast");
function renderDots(){dots.forEach((d,i)=>d.classList.toggle("on",i<entered.length))}
function msg(t){toast.textContent=t;toast.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>toast.classList.remove("show"),1100)}
function unlock(){page1.classList.remove("active");page2.classList.add("active");entered="";renderDots()}
function badPin(){dots[0].parentElement.classList.add("pin-error");msg("Falsche PIN");setTimeout(()=>{dots[0].parentElement.classList.remove("pin-error");entered="";renderDots()},420)}
document.querySelectorAll(".key").forEach(k=>k.onclick=()=>{
 k.classList.add("flash");setTimeout(()=>k.classList.remove("flash"),120);
 let v=k.dataset.k;
 if(v==="back"){entered=entered.slice(0,-1);renderDots();return}
 if(v==="ok"){entered===PIN?unlock():badPin();return}
 if(entered.length<4){entered+=v;renderDots();if(entered.length===4)setTimeout(()=>entered===PIN?unlock():badPin(),120)}
});
forgot.onclick=()=>msg("Bitte Administrator kontaktieren");
document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected"));
 b.classList.add("selected");
 const name=b.dataset.name;
 localStorage.setItem("thaden_vnf_selection",name);
 msg(name+" ausgewählt");
 if(name==="VNF Glasfaser NordWest" || name==="VNF Telekom"){
   setTimeout(()=>{page2.classList.remove("active");page3.classList.add("active");},220);
 }
});
document.querySelectorAll(".area").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".area").forEach(x=>x.classList.remove("selected"));
 b.classList.add("selected");
 localStorage.setItem("thaden_area_selection",b.dataset.area);
 msg(b.dataset.area+" ausgewählt");
});
document.getElementById("backToVnf").onclick=()=>{
 page3.classList.remove("active");page2.classList.add("active");
};
</script>
</body>
</html>
